<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f093fb"/>
      <stop offset="50%" style="stop-color:#f5576c"/>
      <stop offset="100%" style="stop-color:#4facfe"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a8edea"/>
      <stop offset="100%" style="stop-color:#fed6e3"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect x="0" y="280" width="1200" height="4" fill="url(#accent)"/>

  <!-- Decorative circles -->
  <circle cx="100" cy="80" r="40" fill="#f093fb" opacity="0.1"/>
  <circle cx="1100" cy="220" r="60" fill="#4facfe" opacity="0.1"/>
  <circle cx="200" cy="240" r="25" fill="#f5576c" opacity="0.08"/>
  <circle cx="1000" cy="60" r="35" fill="#a8edea" opacity="0.1"/>

  <!-- Icons representing video/image -->
  <!-- Play button icon -->
  <g transform="translate(80, 120)">
    <rect x="0" y="0" width="56" height="40" rx="6" fill="none" stroke="#f093fb" stroke-width="2" opacity="0.6"/>
    <polygon points="22,10 22,30 38,20" fill="#f093fb" opacity="0.6"/>
  </g>

  <!-- Image icon -->
  <g transform="translate(1050, 100)">
    <rect x="0" y="0" width="50" height="40" rx="6" fill="none" stroke="#4facfe" stroke-width="2" opacity="0.6"/>
    <circle cx="16" cy="14" r="5" fill="none" stroke="#4facfe" stroke-width="1.5" opacity="0.6"/>
    <polyline points="5,35 18,22 28,30 35,24 45,35" fill="none" stroke="#4facfe" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- AI sparkle icon -->
  <g transform="translate(560, 40)">
    <path d="M12,0 L14,8 L22,10 L14,12 L12,20 L10,12 L2,10 L10,8 Z" fill="#fed6e3" opacity="0.5"/>
  </g>
  <g transform="translate(640, 230)">
    <path d="M8,0 L10,6 L16,8 L10,10 L8,16 L6,10 L0,8 L6,6 Z" fill="#a8edea" opacity="0.4"/>
  </g>

  <!-- Main title -->
  <text x="600" y="130" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="48" font-weight="800" fill="url(#text-grad)">
    Curated AI Image &amp; Video Tools
  </text>

  <!-- Subtitle -->
  <text x="600" y="175" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#b8b8d4" font-weight="400">
    The definitive collection of AI-powered creative tools
  </text>

  <!-- Category pills -->
  <g transform="translate(240, 210)">
    <rect x="0" y="0" width="120" height="30" rx="15" fill="#f093fb" opacity="0.2"/>
    <text x="60" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#f093fb">Video Gen</text>
  </g>
  <g transform="translate(380, 210)">
    <rect x="0" y="0" width="130" height="30" rx="15" fill="#4facfe" opacity="0.2"/>
    <text x="65" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#4facfe">Image Gen</text>
  </g>
  <g transform="translate(530, 210)">
    <rect x="0" y="0" width="140" height="30" rx="15" fill="#f5576c" opacity="0.2"/>
    <text x="70" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#f5576c">Open Source</text>
  </g>
  <g transform="translate(690, 210)">
    <rect x="0" y="0" width="130" height="30" rx="15" fill="#a8edea" opacity="0.2"/>
    <text x="65" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#a8edea">Audio &amp; 3D</text>
  </g>
  <g transform="translate(840, 210)">
    <rect x="0" y="0" width="120" height="30" rx="15" fill="#fed6e3" opacity="0.2"/>
    <text x="60" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#fed6e3">90+ Tools</text>
  </g>
</svg>